name: Publish Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Project Pages needs /<repository>/; a custom domain needs /.
      # Add public/CNAME when enabling the custom domain in GitHub Pages.
      - name: Resolve Vite base path
        id: vite_base
        shell: bash
        run: |
          if [[ -f public/CNAME ]]; then
            echo 'value=/' >> "$GITHUB_OUTPUT"
          else
            echo "value=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        run: npm run build -- --base "${{ steps.vite_base.outputs.value }}"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public site serves compiled Vue assets
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          html="$RUNNER_TEMP/public-index.html"
          module=""
          for attempt in {1..12}; do
            if curl -fsSL --max-time 15 -o "$html" "${SITE_URL}?deploy=${GITHUB_SHA}&attempt=${attempt}"; then
              module=$(grep -oE 'src="[^"]+/assets/[^"]+\.js"' "$html" | head -n 1 | cut -d '"' -f 2 || true)
              if [[ -n "$module" ]]; then break; fi
            fi
            echo "Attempt $attempt: public page does not yet expose a compiled JS bundle"
            sleep 5
          done
          if [[ -z "$module" ]]; then
            echo "::error::Public page is not serving the Vite output. HTML excerpt:"
            head -c 1200 "$html" || true
            exit 1
          fi
          echo "Published module: $module"
          origin=$(python3 -c 'import sys,urllib.parse; u=urllib.parse.urlsplit(sys.argv[1]); print(u.scheme+"://"+u.netloc)' "$SITE_URL")
          curl -fsSL --max-time 15 -o "$RUNNER_TEMP/site-bundle.js" "$origin$module"
          test -s "$RUNNER_TEMP/site-bundle.js"
          echo "Public HTML and JavaScript bundle returned HTTP 200."
